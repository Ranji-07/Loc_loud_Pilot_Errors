[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "localpilot"
version = "0.1.0"
description = "LocalPilot control plane: health, guided setup runbooks, usage checks"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "psutil>=5.9",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
localpilot = "localpilot.main:run"

[tool.setuptools.packages.find]
include = ["localpilot*"]

[tool.setuptools.package-data]
localpilot = ["migrations/*.mako", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
