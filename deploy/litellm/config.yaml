# LiteLLM proxy routes used by LocalPilot. Keys are not needed for Ollama routes.
model_list:
  - model_name: local-small
    litellm_params:
      model: ollama_chat/qwen2.5:0.5b
      api_base: http://127.0.0.1:11434
  - model_name: remote-small
    litellm_params:
      model: ollama_chat/qwen2.5:0.5b
      api_base: http://127.0.0.1:11435

litellm_settings:
  drop_params: true
  telemetry: false
